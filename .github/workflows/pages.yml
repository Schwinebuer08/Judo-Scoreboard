name: Deploy Website to GitHub Pages and Create Release

on:
  # alle Push-Events zulassen – gefiltert wird erst im Job
  push:
  workflow_dispatch:

# Nur ein Durchlauf pro Branch, in-progress Deployments nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    # läuft NUR auf der Default-Branch
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./Judo_Scoreboard/
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Judo Scoreboard ${{ github.ref_name }}
          body: |
            DE:
            Laden wir einfach die zip Datei herunter,
            kopieren sie den Ordner aus der .zip datei an einen beliebeigen Ort,
            öffnen diesen Ordner
            und lesen sich die Wichtigen Hinweise durch.

            Viel Spaß

            EN:
            Simply download the zip file,
            copy the folder from the .zip file to any location,
            open this folder,
            and read the important information.

            Have Fun


      - name: Upload Release Asset
        id: upload-release-asset 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
          asset_path: ./_site
          asset_name: Judo-Scoreboard.zip
          asset_content_type: application/zip

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages       # bleibt unverändert
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
