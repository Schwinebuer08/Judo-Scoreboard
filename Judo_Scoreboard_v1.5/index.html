<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Judo Scoreboard</title>
  <link rel="icon" type="image/x-icon" href="img/logo_tsv.png" />
  <link href="style.css" rel="stylesheet" />
  <script src="scripte/punkte.js"></script>
  <script src="scripte/Oseikomi/counterw.js"></script>
  <script src="scripte/Oseikomi/counterb.js"></script>
  <script src="scripte/time.js"></script>
  <script src="scripte/shido.js"></script>
  <script src="scripte/config.js"></script>
  <script src="scripte/cmd.js"></script>
  <script src="scripte/view.js"></script>
</head>

<body>
  <nav>
    <div class="title">
      <div class="config" id="config" style="display: none">
        Max. Punkte
        <input type="text" id="poi" value="10" />
        Oseikomi in Sek.
        <input type="text" id="ose" value="20" />
        Kampfzeit in min.
        <input type="text" id="tim" value="2" />
        Punkte für Yuko
        <input type="text" id="yuk" value="1" />
        Punkte für Waza-ari
        <input type="text" id="waz" value="2" />
        Punkte für Ippon
        <input type="text" id="ipp" value="3" />
        <button onclick="saveConfig()">Save</button>
      </div>
      <input type="text" class="links title" id="Tunier" placeholder="Tunier" />
      <input type="text" class="rechts title" id="Gewichtsklasse" placeholder="Gewichtsklasse" />
    </div>
  </nav>
 <button onclick="openMirroredWindow()">Gespiegeltes Fenster öffnen</button>
   <!--<a href="#view" type="button" target="_blank">Gespiegeltes Fenster öffnen</a>-->

  <main id="main">
    <div class="kämpfer">
      <div class="links">
        <input class="inw" type="text" id="KampferA" placeholder="Kämpfer A" value="---"><br />
        <div class="Punkte">
          <p id="PunkteWeiß" onclick="clickPunkteWeiß()">0 Punkte</p>
          <div class="pktBtn optional">
            <button onclick="weißipp()">+</button>
            <p class="pkt">Ippon</p>
            <button onclick="minusweißipp()">-</button>
          </div>
          <div class="pktBtn optional">
            <button onclick="weißwaz()">+</button>
            <p class="pkt">Wa-zari</p>
            <button onclick="minusweißwaz()">-</button>
          </div>
          <div class="pktBtn optional">
            <button onclick="weißyuko()">+</button>
            <p class="pkt">Yuko</p>
            <button onclick="minusweißyuko()">-</button>
          </div>
        </div>
        <br />
        <p id="counterw" onclick="clickOseikomiWeiß()">Oseikomi: 0 Sekunden</p>
        <br />
        <p id="Shidow" onclick="clickShidoWeiß()">Shido</p>
      </div>
      <div class="rechts">
        <input class="inb" type="text" id="KampferB" placeholder="Kämpfer B" value="---" /><br />
        <div class="Punkte">
        <p id="PunkteBlau" onclick="clickPunkteBlau()">0 Punkte</p>
          <div class="pktBtn optional">
            <button onclick="blauipp()">+</button>
            <p class="pkt">Ippon</p>
            <button onclick="minusblauipp()">-</button>
          </div>
          <div class="pktBtn optional">
            <button onclick="blauwaz()">+</button>
            <p class="pkt">Wa-zari</p>
            <button onclick="minusblauwaz()">-</button>
          </div>
          <div class="pktBtn optional">
            <button onclick="blauyuko()">+</button>
            <p class="pkt">Yuko</p>
            <button onclick="minusblauyuko()">-</button>
          </div>
        </div>
        <br />
        <p id="counterb" onclick="clickOseikomiBlau()">Oseikomi: 0 Sekunden</p>
        <br />
        <p id="Shidob" onclick="clickShidoBlau()">Shido</p>
      </div>
    </div>
  </main>
  
  <footer class="shido_time" id="shido_time">
    <img class="red_dot" id="img1w" src="img/red_dot.png" style="visibility: hidden" />
    <img class="red_dot" id="img2w" src="img/red_dot.png" style="visibility: hidden" />
    <img class="red_dot" id="img3w" src="img/red_dot.png" style="visibility: hidden" />
    <p class="countdown" id="countdown" onclick="clickTime()">2:00</p>
    <img class="red_dot" id="img3b" src="img/red_dot.png" style="visibility: hidden" />
    <img class="red_dot" id="img2b" src="img/red_dot.png" style="visibility: hidden" />
    <img class="red_dot" id="img1b" src="img/red_dot.png" style="visibility: hidden" />
  </footer>
  
</body>
</html>
